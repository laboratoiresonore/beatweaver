<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Beatweaver</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #06070A;
    --bg-2: #0A0B10;
    --surface: #0E1015;
    --surface-2: #14161D;
    --hair: #1B1E27;
    --hair-strong: #262A36;
    --text: #E6E8EE;
    --text-2: #9097A6;
    --muted: #535A6B;

    --accent: oklch(0.74 0.16 240);
    --accent-soft: oklch(0.74 0.16 240 / 0.18);
    --accent-line: oklch(0.74 0.16 240 / 0.45);
    --warn: oklch(0.78 0.15 75);
    --ok: oklch(0.78 0.16 155);
    --danger: oklch(0.66 0.20 24);

    --bass: oklch(0.72 0.14 160);
    --energy: oklch(0.74 0.15 60);
    --texture: oklch(0.68 0.18 305);
    --fx: oklch(0.72 0.20 355);

    --shadow-1: 0 1px 0 rgba(255,255,255,0.02) inset, 0 0 0 1px var(--hair);
    --shadow-2: 0 1px 0 rgba(255,255,255,0.03) inset, 0 0 0 1px var(--hair-strong);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body, #root { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Space Grotesk", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    user-select: none;
  }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-feature-settings: "tnum", "ss01"; }
  .grain::before {
    content: "";
    position: fixed; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.012) 1px, transparent 1px);
    background-size: 3px 3px;
    pointer-events: none; z-index: 0;
  }
  button { font-family: inherit; cursor: pointer; }
  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--hair-strong); border-radius: 3px; }

  /* === Tooltips: pure CSS === */
  .tt { position: relative; }
  .tt[data-tip]:hover::after {
    content: attr(data-tip);
    position: absolute; bottom: calc(100% + 8px); left: 50%;
    transform: translateX(-50%);
    background: #0a0b0f; border: 1px solid var(--hair-strong);
    color: var(--text-2);
    padding: 4px 8px; border-radius: 4px;
    font-size: 10px; font-family: "JetBrains Mono", monospace; letter-spacing: 0.05em;
    white-space: nowrap; pointer-events: none; z-index: 100;
  }

  /* === Beat ring === */
  @keyframes beatPulse {
    0%   { transform: scale(1);   opacity: 0.9; }
    100% { transform: scale(1.6); opacity: 0; }
  }
  .beat-ring { animation: beatPulse 0.5s ease-out; }

  @keyframes confidenceShimmer {
    0%, 100% { opacity: 0.85; }
    50% { opacity: 1; }
  }
  .shimmer { animation: confidenceShimmer 2.5s ease-in-out infinite; }

  /* === Diagonal cell === */
  .cell-wrap {
    position: relative;
    border-radius: 6px;
    overflow: hidden;
    background: var(--surface);
    border: 1px solid var(--hair);
    transition: border-color 160ms ease, box-shadow 160ms ease;
  }
  .cell-wrap:hover { border-color: var(--hair-strong); }
  .cell-half {
    position: absolute; inset: 0;
    display: flex; align-items: flex-end;
    transition: background-color 160ms ease;
    cursor: pointer;
  }
  .cell-half[data-pos="a"] { clip-path: polygon(0 0, 100% 0, 0 100%); align-items: flex-start; justify-content: flex-start; }
  .cell-half[data-pos="b"] { clip-path: polygon(100% 0, 100% 100%, 0 100%); align-items: flex-end; justify-content: flex-end; }
  .diag-line {
    position: absolute; inset: 0; pointer-events: none; z-index: 5;
    background: linear-gradient(to bottom right,
      transparent calc(50% - 0.5px),
      rgba(255,255,255,0.07) calc(50% - 0.5px),
      rgba(255,255,255,0.07) calc(50% + 0.5px),
      transparent calc(50% + 0.5px));
  }

  @keyframes wobble {
    0%   { transform: scale(1)    rotate(0); }
    20%  { transform: scale(1.18) rotate(-3deg); }
    40%  { transform: scale(1.22) rotate(2deg); }
    60%  { transform: scale(1.12) rotate(-1deg); }
    80%  { transform: scale(1.05) rotate(1deg); }
    100% { transform: scale(1)    rotate(0); }
  }
  .wobble { animation: wobble 600ms cubic-bezier(.2,.7,.3,1.2); transform-origin: center; display: inline-block; }

  @keyframes ledBreath {
    0%, 100% { opacity: 0.55; box-shadow: 0 0 4px currentColor; }
    50%      { opacity: 1;    box-shadow: 0 0 9px currentColor, 0 0 14px currentColor; }
  }
  .led-breath { animation: ledBreath 1.4s ease-in-out infinite; }

  @keyframes readyGlow {
    0%, 100% { box-shadow: 0 0 0 1px var(--ready, var(--accent-line)) inset, 0 0 8px var(--ready, var(--accent-line)); }
    50%      { box-shadow: 0 0 0 1px var(--ready, var(--accent-line)) inset, 0 0 18px var(--ready, var(--accent-line)); }
  }
  .ready { animation: readyGlow 1.4s ease-in-out infinite; }

  /* === Sliders === */
  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 2px; border-radius: 1px;
    background: var(--hair-strong); outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--text); border: 2px solid var(--bg);
    box-shadow: 0 0 0 1px var(--hair-strong);
    cursor: pointer;
  }
  input[type="range"]::-moz-range-thumb {
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--text); border: 2px solid var(--bg);
    cursor: pointer;
  }

  /* === Preset glyph (subtle silhouette behind label) === */
  .glyph-wrap {
    position: absolute;
    width: 26%; aspect-ratio: 1;
    pointer-events: none; z-index: 1;
    transform: translate(-50%, -50%);
    transition: opacity 200ms ease, color 200ms ease;
  }
  .cell-half[data-pos="a"] .glyph-wrap { left: 36%; top: 36%; }
  .cell-half[data-pos="b"] .glyph-wrap { left: 64%; top: 64%; }
  .glyph-idle   { color: rgba(255,255,255,0.09); }
  .glyph-hot    { color: rgba(255,255,255,0.20); }
  .glyph-ready  { color: var(--ready, var(--accent)); opacity: 0.65; filter: drop-shadow(0 0 6px var(--ready, var(--accent))); }
  .glyph-active { color: rgba(0,0,0,0.55); }

  /* Inner element of every glyph for animation hooks (set by JS via .glyph-anim class) */
  .glyph-anim { transform-origin: 50% 50%; }

  /* === Glyph animations === */
  /* Hover: gentle pulse + slight rotation */
  @keyframes glyphHover {
    0%, 100% { transform: scale(1) rotate(0deg); }
    50%      { transform: scale(1.10) rotate(2deg); }
  }
  .cell-half:hover .glyph-anim { animation: glyphHover 1.4s ease-in-out infinite; }

  /* Active: stronger continuous pulse, faster */
  @keyframes glyphActive {
    0%, 100% { transform: scale(0.94); }
    50%      { transform: scale(1.10); }
  }
  .glyph-active .glyph-anim { animation: glyphActive 0.9s ease-in-out infinite; }

  /* Ready (armed): slow drift / shimmer */
  @keyframes glyphReady {
    0%, 100% { transform: translateX(-2%) rotate(-2deg); opacity: 0.55; }
    50%      { transform: translateX(2%)  rotate(2deg);  opacity: 1;    }
  }
  .glyph-ready .glyph-anim { animation: glyphReady 1.6s ease-in-out infinite; }

  /* Hot (column has at least one active): subtle slow breathe */
  @keyframes glyphHot {
    0%, 100% { transform: scale(1);    opacity: 0.85; }
    50%      { transform: scale(1.04); opacity: 1;    }
  }
  .glyph-hot .glyph-anim { animation: glyphHot 2.4s ease-in-out infinite; }

  /* Glyph SVG fills the wrap and respects transforms via inner group */
  .glyph-wrap svg { width: 100%; height: 100%; display: block; }

  /* === Analog flip-switch (routing mode) === */
  .flip-switch {
    width: 26px; height: 56px;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .flip-switch-body {
    position: relative;
    width: 22px; height: 52px;
    border-radius: 6px;
    background: linear-gradient(180deg, #1A1D26 0%, #0A0B10 100%);
    border: 1px solid var(--hair-strong);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), inset 0 -1px 0 rgba(0,0,0,0.5), 0 1px 2px rgba(0,0,0,0.4);
  }
  .flip-switch-screw {
    position: absolute;
    left: 50%; transform: translateX(-50%);
    width: 4px; height: 4px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #5A6072 0%, #1F2230 100%);
    box-shadow: inset 0 0 1px rgba(0,0,0,0.8);
  }
  .flip-switch-lever {
    position: absolute;
    left: 50%; top: 50%;
    width: 2px; height: 18px;
    transform: translate(-50%, -50%);
    background: linear-gradient(180deg, #4A4F5E 0%, #2A2D38 100%);
    border-radius: 1px;
  }
  .flip-switch-knob {
    position: absolute;
    left: 50%; width: 16px; height: 16px;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    transition: top 220ms cubic-bezier(0.4, 1.6, 0.6, 1);
    z-index: 2;
    border: 1px solid rgba(0,0,0,0.5);
  }
  .flip-switch.up   .flip-switch-knob { top: 22%; }
  .flip-switch.down .flip-switch-knob { top: 78%; }
  @keyframes armedPulse {
    0%, 100% { opacity: 0.85; }
    50%      { opacity: 1; }
  }
  .armed-pill { animation: armedPulse 1.1s ease-in-out infinite; }

  /* === FIRE! button on armed presets === */
  .fire-btn {
    position: relative;
    width: 38px; height: 38px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 8.5px; letter-spacing: 0.04em; font-weight: 700;
    text-shadow: 0 1px 0 rgba(255,255,255,0.25);
    z-index: 2;
    animation: firePulse 1.1s ease-in-out infinite;
  }
  .fire-halo {
    position: absolute;
    width: 70px; height: 70px; border-radius: 50%;
    left: 50%; top: 50%; transform: translate(-50%, -50%);
    z-index: 1; pointer-events: none;
    animation: fireHalo 1.6s ease-in-out infinite;
  }
  @keyframes firePulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.06); }
  }
  @keyframes fireHalo {
    0%, 100% { transform: translate(-50%, -50%) scale(0.85); opacity: 0.55; }
    50%      { transform: translate(-50%, -50%) scale(1.05); opacity: 1; }
  }

  @keyframes spark {
    0%   { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
  }
  .spark {
    position: absolute; width: 3px; height: 3px; border-radius: 50%;
    pointer-events: none;
    animation: spark 600ms ease-out forwards;
  }

  /* === Top bar texture === */
  .panel {
    background: linear-gradient(180deg, #11131A 0%, #0C0E13 100%);
    border: 1px solid var(--hair);
    border-radius: 10px;
    box-shadow: 0 1px 0 rgba(255,255,255,0.025) inset;
  }
  .panel-flat {
    background: var(--surface);
    border: 1px solid var(--hair);
    border-radius: 8px;
  }

  /* === Toggle === */
  .toggle {
    position: relative; width: 30px; height: 16px; border-radius: 999px;
    background: var(--hair-strong); border: 1px solid var(--hair-strong);
    transition: background 160ms ease;
  }
  .toggle::after {
    content: ""; position: absolute; top: 1px; left: 1px;
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--text-2);
    transition: transform 160ms ease, background 160ms ease;
  }
  .toggle.on { background: var(--accent-soft); border-color: var(--accent-line); }
  .toggle.on::after { transform: translateX(14px); background: var(--accent); }

  /* === Lock pill === */
  .pill { font-size: 9px; letter-spacing: 0.14em; padding: 3px 7px; border-radius: 999px; text-transform: uppercase; }

  /* === Live waveform === */
  .wave-bar { background: currentColor; border-radius: 0.5px; transition: height 80ms linear; }

  /* Confidence ring */
  .ring-track { stroke: rgba(255,255,255,0.06); }
  .ring-fill  { stroke-linecap: round; transition: stroke-dashoffset 0.3s ease, stroke 0.3s ease; }

  /* fade-in on first render */
  @keyframes appearUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .appear-up { animation: appearUp 0.5s cubic-bezier(.2,.7,.3,1.0) both; }

  /* History strip */
  .history-block { transition: opacity 200ms ease; }

  /* Wide screen layout */
  .root { position: relative; height: 100vh; padding: 16px; display: flex; flex-direction: column; gap: 12px; z-index: 1; }
</style>
</head>
<body class="grain">
  <div id="root"></div>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="glyphs.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
