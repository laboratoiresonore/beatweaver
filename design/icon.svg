<?xml version="1.0" encoding="UTF-8"?>
<!--
  BEATWEAVER app icon — vector source.
  Palette matches the live app's category colors:
    BASS    #10B176  ENERGY  #E0641B  TEXTURE #B432FF  FX      #FF127B
  Generates the bundled raster (build/icon.png, 1024×1024) via scripts/generate-icon.js.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Beatweaver">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#0A0B10"/>
      <stop offset="55%" stop-color="#0E1015"/>
      <stop offset="100%" stop-color="#06070A"/>
    </linearGradient>
    <linearGradient id="bar-bass" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%"  stop-color="#10B176" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#10B176"/>
    </linearGradient>
    <linearGradient id="bar-energy" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%"  stop-color="#E0641B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#E0641B"/>
    </linearGradient>
    <linearGradient id="bar-texture" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%"  stop-color="#B432FF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#B432FF"/>
    </linearGradient>
    <linearGradient id="bar-fx" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%"  stop-color="#FF127B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FF127B"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded chassis (matches design handoff panel radius scaled up) -->
  <rect x="0" y="0" width="1024" height="1024" rx="220" ry="220" fill="url(#bg)"/>
  <rect x="20" y="20" width="984" height="984" rx="200" ry="200" fill="none" stroke="#1B1E27" stroke-width="2"/>

  <!--
    4-bar VU-meter glyph — one bar per category. Heights drop a soft arch
    (0.55 → 0.85 → 0.85 → 0.55) so the glyph reads as "balance + motion"
    rather than a literal frequency response.
  -->
  <g filter="url(#glow)" transform="translate(232, 320)">
    <rect x="0"   y="180" width="100" height="220" rx="14" ry="14" fill="url(#bar-bass)"/>
    <rect x="160" y="60"  width="100" height="340" rx="14" ry="14" fill="url(#bar-energy)"/>
    <rect x="320" y="60"  width="100" height="340" rx="14" ry="14" fill="url(#bar-texture)"/>
    <rect x="480" y="180" width="100" height="220" rx="14" ry="14" fill="url(#bar-fx)"/>
  </g>

  <!-- Wordmark BW monogram below the bars -->
  <text x="512" y="860"
        text-anchor="middle"
        font-family="JetBrains Mono, ui-monospace, monospace"
        font-weight="700"
        font-size="160"
        letter-spacing="8"
        fill="#E6E8EE">BW</text>

  <!-- Meter underline (dashed tick row, mirrors the wordmark underline in the design) -->
  <g stroke="#535A6B" stroke-width="3" stroke-linecap="round">
    <line x1="370" y1="900" x2="380" y2="900"/>
    <line x1="400" y1="900" x2="410" y2="900"/>
    <line x1="430" y1="900" x2="440" y2="900"/>
    <line x1="460" y1="900" x2="470" y2="900"/>
    <line x1="490" y1="900" x2="500" y2="900"/>
    <line x1="520" y1="900" x2="530" y2="900"/>
    <line x1="550" y1="900" x2="560" y2="900"/>
    <line x1="580" y1="900" x2="590" y2="900"/>
    <line x1="610" y1="900" x2="620" y2="900"/>
    <line x1="640" y1="900" x2="650" y2="900"/>
  </g>
</svg>
